[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-nmi-ced"
version = "0.1.0"
description = "Qwen3.8-27B cross-layer KV research adapter and controlled experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers>=5.0,<6", "accelerate>=1.0", "safetensors>=0.5"]

[project.optional-dependencies]
train = ["datasets>=3.0", "pyyaml>=6.0", "bitsandbytes>=0.46"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
