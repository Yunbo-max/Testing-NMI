experiment_id: qwen38-ced-48h-v1
base_model: Qwen/Qwen3.8-27B
base_revision: PIN_AT_EXECUTION
model_type: qwen3_5
hardware_assumption: '1x NVIDIA H100 80GB'
language_only_primary: true
num_layers: 64
hidden_size: 5120
encoder_last_layer_1based: 32
full_attention_layer_ids_1based: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64]
late_reader_layer_ids_1based: [36, 40, 44, 48, 52, 56, 60, 64]
kv_heads: 4
kv_head_dim: 256
attention_q_heads: 24
rotary_dim: 64
beta_variants:
  B0: {mode: original, training: false, expected_unique_gqa_groups: 16}
  B0T: {mode: original, status: planned, training: true, expected_unique_gqa_groups: 16, matched_data: true}
  B1a: {mode: late_pairs, status: planned, training: true, expected_unique_gqa_groups: 12, matched_data: true}
  B1b: {mode: late_all_share, status: local_cpu_tested, training: true, expected_unique_gqa_groups: 9, matched_data: true}
  B1q: {mode: original_kv_quant, status: planned, training: false, expected_unique_gqa_groups: 16, optional: true}
  B1s: {mode: late_all_share_sparse, status: planned, training: true, optional: true, beyond_48h: true}
  B2: {mode: state_reconstruction_full_ced, status: planned, training: true, beyond_48h: true, hypothesis_only: true}
training_pilot:
  dtype: bf16
  optimizer: adamw
  micro_batch: 1
  grad_accum: 1
  seq_len: 128
  initial_projector_lr: 0.0002
  warmup_steps: 100
  lora_rank: null  # not implemented in B1b; future control
  lora_alpha: null  # not implemented in B1b; future control
  clip_grad_norm: 1.0
  seed: 1337
  teacher_temperature: 2.0
  loss_weights: {causal_ce: 1.0, logit_kl: null, attention_feature: null} # CE only in end-to-end B1b; teacher feature warmup separate
  enable_teacher_distill_only_if_fit: false # logits distillation not implemented
  no_automatic_full_finetune: true
benchmark:
  lengths: [1024, 8192, 32768]
  decode_new_tokens: [256, 256, 512]
  bf16: true
  warmup_repeats: 3
  paired_repeats: 10
  outputs: [heldout_ce, teacher_kl, task_accuracy, peak_vram, unique_kv_bytes, prefill_ms, decode_tokens_per_s]
quality_guardrails:
  max_relative_ce_increase_vs_trained_control: 0.05
  zero_future_leakage_required: true
  incremental_vs_full_parity_required: true
  physical_kv_reuse_required: true

dataset_protocol:
  status: specified_not_yet_downloaded_on_H100
  primary_id: HuggingFaceFW/fineweb-edu
  primary_config: sample-10BT
  primary_upstream_split: train
  primary_revision: PIN_AT_EXECUTION
  prep_command: scripts/prepare_fineweb.py
  out_dir: artifacts/data/fineweb_pilot_v1
  prepared_token_quotas: {train: 120000, val: 20000, test: 20000}
  split: "SHA256(exact_normalized_text) first 48 bits modulo 10: 0..7=train, 8=val, 9=test"
  shuffle_seed: 1337
  shuffle_buffer: 10000
  min_document_tokens: 16
  max_document_tokens: 128
  reported_actual_train_tokens_from: artifacts/train_b1/metrics.jsonl
  internal_test_use: frozen_post_selection_only
  independent_lm_id: Salesforce/wikitext
  independent_lm_config: wikitext-103-raw-v1
  independent_lm_splits: [validation, test]
  leakage_note: "within-source splits only; Qwen base-pretraining contamination is unknown"
evaluation_protocol:
  primary_metric: bounded_document_token_weighted_ce
  ppl_formula: "exp(token_weighted_cross_entropy_nats)"
  primary_evaluator: scripts/eval_nll.py
  primary_evaluator_status: implemented_not_H100_verified
  compare_base_to_shared_status: diagnostic_only_without_matched_B0T
  b0t_matched_control_status: planned_not_implemented
  stats: "paired document uncertainty and training seed variation after enough real runs"
  native_ruler: planned_not_implemented
  native_longbench_v2: planned_not_implemented
  native_humaneval: planned_not_implemented
  native_gsm8k: planned_not_implemented
  wiki_full_corpus_ppl: planned_not_implemented
  performance: "prefill forward time, decode tok/s, physical GQA KV bytes, separate GDN states and peak VRAM"
  benchmark_script_status: "single_run_diagnostic_only; paired warm repeated evaluator pending"
  contexts: [1024, 4096, 8192, 16384, 32768]
  seed: 1337
  disclaimer: "No official benchmark or 27B metric was measured by this config publication"
